scene_config: scene_office.yaml
robot_config: robot_go2_camera.yaml
domain_randomization_config: domain_randomization.yaml
packing_config: packing.yaml

runtime:
  run_name: door_curriculum
  dataset_name: go2_isaac_door_curriculum
  headless: true
  auto_pack: false
  num_episodes: 400
  max_steps_per_episode: 220
  seed: 0
  output_dir: ../data/sim_sessions/door_curriculum_seed0
  packed_output_dir: ../data/pipeline_sim_door_curriculum_seed0

sim:
  device: cuda:0
  physics_dt: 0.01
  control_dt: 0.05
  warmup_steps_after_reset: 3

data:
  image_format: jpg
  jpeg_quality: 95
  chunk_len: 4
  state_fields: [vx, vy, vz]
  train_action_fields: [vx, wz]
  raw_action_fields: [vx, vy, wz]

controller:
  vx_min: -0.1
  vx_max: 0.9
  wz_min: -1.4
  wz_max: 1.4
  k_vx: 0.72
  k_wz: 2.20
  goal_tolerance: 0.42
  turn_in_place_angle_deg: 58.0
  slow_angle_deg: 18.0
  min_turning_wz: 0.26
  vx_acc_limit: 0.9
  wz_acc_limit: 3.2

scene:
  scene_id: office_door_proxy
  goal_box:
    size: [0.12, 1.00, 1.10]
    color: [0.70, 0.50, 0.28]
    height: 0.55

domain_randomization:
  level: medium
  camera:
    enabled: true
    pos_jitter: [0.015, 0.015, 0.008]
    yaw_jitter_deg: 5.0
  lighting:
    enabled: true
    intensity_jitter: [0.75, 1.25]
  dynamics:
    enabled: false
    friction_jitter: [0.9, 1.1]
    latency_steps: [0, 1]

task:
  task_id: goal_navigation
  scene_mode: door_curriculum_nav
  target_class: door
  target_color: brown
  target_shape: door
  goal_label: door
  instruction_templates:
    - id: go_to_door
      text: go to the door
    - id: move_to_door
      text: move to the door
    - id: navigate_to_door
      text: navigate to the door
    - id: approach_door
      text: approach the door
  goal_distance_range: [1.0, 3.2]
  goal_region_resample_attempts: 320
  max_resample_attempts: 256
  default_split_hint: train_candidate
  workspace:
    x: [-4.5, 4.5]
    y: [-3.5, 3.5]
  visibility_curriculum:
    visible_early_ratio: 0.65
    visible_after_small_turn_ratio: 0.25
    search_ratio: 0.10
  visibility_probe:
    horizon_steps: 10
    min_depth: 0.40
    min_pixel_ratio: 0.0035
    horizontal_margin_deg: 3.5
    vertical_margin_deg: 3.5
  layout_templates:
    - id: forward_doorway
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.0, -1.2], y: [-0.7, 0.7]}
      goal_region: {x: [0.0, 1.2], y: [-0.8, 0.8]}
      distance_range: [1.2, 2.8]
      yaw_jitter_deg: 4.0
    - id: left_door_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.2, -1.4], y: [-1.6, -0.3]}
      goal_region: {x: [0.1, 1.3], y: [0.0, 1.3]}
      distance_range: [1.2, 3.0]
      yaw_jitter_deg: 4.0
    - id: right_door_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.2, -1.4], y: [0.3, 1.6]}
      goal_region: {x: [0.1, 1.3], y: [-1.3, 0.0]}
      distance_range: [1.2, 3.0]
      yaw_jitter_deg: 4.0
    - id: left_corner_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.6, -1.7], y: [-1.7, -0.4]}
      goal_region: {x: [0.3, 1.5], y: [-0.2, 1.4]}
      distance_range: [1.4, 3.0]
      yaw_jitter_deg: 3.0
    - id: right_corner_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.6, -1.7], y: [0.4, 1.7]}
      goal_region: {x: [0.3, 1.5], y: [-1.4, 0.2]}
      distance_range: [1.4, 3.0]
      yaw_jitter_deg: 3.0
    - id: hidden_door_search
      visibility_buckets: [search]
      spawn_region: {x: [-2.8, -1.9], y: [-1.8, 1.8]}
      goal_region: {x: [1.0, 2.1], y: [-1.8, 1.8]}
      distance_range: [1.8, 3.0]
      yaw_jitter_deg: 3.0

packing:
  chunk_len: 4
  min_episode_steps: 8
  require_success: true
  drop_collision_episodes: true
  drop_fall_episodes: false
  min_progress_distance: 0.25
  turning_threshold: 0.1
  require_visibility_metadata: true
  allow_search_episodes: true
  visibility_sample_quota:
    enabled: true
    visible_early_ratio: 0.65
    visible_after_small_turn_ratio: 0.25
    search_ratio: 0.10
  split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
