scene_config: scene_office.yaml
robot_config: robot_go2_camera.yaml
domain_randomization_config: domain_randomization.yaml
packing_config: packing.yaml

runtime:
  run_name: box_curriculum_depth_probe
  dataset_name: go2_isaac_box_curriculum_depth_probe
  headless: true
  auto_pack: false
  num_episodes: 100
  max_steps_per_episode: 220
  seed: 0
  output_dir: ../data/sim_sessions/box_curriculum_depth_probe_seed0
  packed_output_dir: ../data/pipeline_sim_box_curriculum_depth_probe_seed0

sim:
  device: cuda:0
  physics_dt: 0.01
  control_dt: 0.05
  warmup_steps_after_reset: 3

data:
  image_format: jpg
  jpeg_quality: 95
  depth_format: png
  depth_scale: 1000.0
  chunk_len: 4
  state_fields: [vx, vy, vz]
  train_action_fields: [vx, wz]
  raw_action_fields: [vx, vy, wz]

camera:
  enable_depth: true
  depth_data_type: distance_to_image_plane
  depth_min: 0.20
  depth_max: 10.0
  depth_invalid_fill_value: 0.0

controller:
  vx_min: -0.1
  vx_max: 0.9
  wz_min: -1.4
  wz_max: 1.4
  k_vx: 0.74
  k_wz: 2.30
  goal_tolerance: 0.38
  turn_in_place_angle_deg: 58.0
  slow_angle_deg: 18.0
  min_turning_wz: 0.28
  vx_acc_limit: 0.9
  wz_acc_limit: 3.2

scene:
  scene_id: office_box_proxy
  goal_box:
    size: [0.35, 0.35, 0.50]
    color: [0.05, 0.05, 0.05]
    height: 0.25

domain_randomization:
  level: medium
  camera:
    enabled: true
    pos_jitter: [0.015, 0.015, 0.008]
    yaw_jitter_deg: 5.0
  lighting:
    enabled: true
    intensity_jitter: [0.75, 1.25]
  dynamics:
    enabled: false
    friction_jitter: [0.9, 1.1]
    latency_steps: [0, 1]

task:
  task_id: goal_navigation
  scene_mode: box_curriculum_nav
  target_class: black_box
  target_color: black
  target_shape: box
  goal_label: black box
  instruction_templates:
    - id: go_to_black_box
      text: go to the black box
    - id: move_to_black_box
      text: move to the black box
    - id: navigate_to_black_box
      text: navigate to the black box
    - id: approach_black_box
      text: approach the black box
  goal_distance_range: [0.9, 2.8]
  goal_region_resample_attempts: 320
  max_resample_attempts: 256
  default_split_hint: train_candidate
  workspace:
    x: [-4.5, 4.5]
    y: [-3.5, 3.5]
  visibility_curriculum:
    visible_early_ratio: 0.58
    visible_after_small_turn_ratio: 0.27
    search_ratio: 0.15
  visibility_probe:
    horizon_steps: 10
    min_depth: 0.40
    min_pixel_ratio: 0.0025
    horizontal_margin_deg: 3.5
    vertical_margin_deg: 3.5
  layout_templates:
    - id: short_forward_center
      visibility_buckets: [visible_early]
      spawn_region: {x: [-1.9, -1.1], y: [-0.7, 0.7]}
      goal_region: {x: [-0.3, 0.9], y: [-0.8, 0.8]}
      distance_range: [1.0, 2.4]
      yaw_jitter_deg: 4.0
    - id: left_offset_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.1, -1.3], y: [-1.6, -0.3]}
      goal_region: {x: [-0.5, 0.8], y: [0.0, 1.2]}
      distance_range: [1.1, 2.6]
      yaw_jitter_deg: 4.0
    - id: right_offset_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.1, -1.3], y: [0.3, 1.6]}
      goal_region: {x: [-0.5, 0.8], y: [-1.2, 0.0]}
      distance_range: [1.1, 2.6]
      yaw_jitter_deg: 4.0
    - id: doorway_left_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.4, -1.6], y: [-1.7, -0.4]}
      goal_region: {x: [0.2, 1.2], y: [-0.2, 1.3]}
      distance_range: [1.1, 2.6]
      yaw_jitter_deg: 3.0
    - id: doorway_right_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.4, -1.6], y: [0.4, 1.7]}
      goal_region: {x: [0.2, 1.2], y: [-1.3, 0.2]}
      distance_range: [1.1, 2.6]
      yaw_jitter_deg: 3.0
    - id: blind_corner_search
      visibility_buckets: [search]
      spawn_region: {x: [-2.8, -1.8], y: [-1.8, 1.8]}
      goal_region: {x: [0.9, 2.0], y: [-1.8, 1.8]}
      distance_range: [1.5, 2.5]
      yaw_jitter_deg: 3.0

packing:
  chunk_len: 4
  min_episode_steps: 8
  require_success: true
  drop_collision_episodes: true
  drop_fall_episodes: false
  min_progress_distance: 0.25
  turning_threshold: 0.1
  require_visibility_metadata: true
  allow_search_episodes: true
  visibility_sample_quota:
    enabled: true
    visible_early_ratio: 0.58
    visible_after_small_turn_ratio: 0.27
    search_ratio: 0.15
  split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
