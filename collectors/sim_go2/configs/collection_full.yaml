scene_config: scene_office.yaml
robot_config: robot_go2_camera.yaml
domain_randomization_config: domain_randomization.yaml
packing_config: packing.yaml

runtime:
  run_name: full_goal_nav
  dataset_name: go2_isaac_full_goal_nav
  headless: true
  auto_pack: false
  num_episodes: 4000
  max_steps_per_episode: 260
  seed: 0
  output_dir: ../data/isaac_sim_raw/full_goal_nav_seed0
  packed_output_dir: ../data/isaac_sim_packed/full_goal_nav_seed0

sim:
  device: cuda:0
  physics_dt: 0.01
  control_dt: 0.05
  warmup_steps_after_reset: 3

data:
  image_format: jpg
  jpeg_quality: 95
  chunk_len: 4
  state_fields: [vx, vy, vz]
  train_action_fields: [vx, wz]
  raw_action_fields: [vx, vy, wz]

controller:
  vx_min: -0.1
  vx_max: 1.0
  wz_min: -1.5
  wz_max: 1.5
  k_vx: 0.76
  k_wz: 2.3
  goal_tolerance: 0.4
  turn_in_place_angle_deg: 60.0
  slow_angle_deg: 18.0
  min_turning_wz: 0.26
  vx_acc_limit: 1.0
  wz_acc_limit: 3.0

task:
  task_id: goal_navigation
  scene_mode: full_collection
  target_class: black_box
  target_color: black
  target_shape: box
  goal_label: black box
  instruction_templates:
    - id: go_to_black_box_plain
      text: go to the black box
    - id: approach_black_box
      text: approach the black box
    - id: move_to_black_box
      text: move to the black box
  goal_distance_range: [0.8, 4.4]
  turning_angle_tolerance_deg: 26.0
  goal_region_resample_attempts: 320
  max_resample_attempts: 192
  default_split_hint: train_candidate
  workspace:
    x: [-4.5, 4.5]
    y: [-3.5, 3.5]
  turning_strategy:
    straight_ratio: 0.12
    left_small_ratio: 0.20
    left_large_ratio: 0.24
    right_small_ratio: 0.18
    right_large_ratio: 0.20
    reverse_reorient_ratio: 0.06
