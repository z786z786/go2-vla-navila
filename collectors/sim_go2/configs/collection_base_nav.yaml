scene_config: scene_office.yaml
robot_config: robot_go2_camera.yaml
domain_randomization_config: domain_randomization.yaml
packing_config: packing.yaml

runtime:
  run_name: base_goal_nav
  dataset_name: go2_isaac_base_goal_nav_visible
  headless: true
  auto_pack: false
  num_episodes: 500
  max_steps_per_episode: 180
  seed: 0
  output_dir: ../data/isaac_sim_raw/base_visible_nav_seed0
  packed_output_dir: ../data/isaac_sim_packed/base_visible_nav_seed0

sim:
  device: cuda:0
  physics_dt: 0.01
  control_dt: 0.05
  warmup_steps_after_reset: 3

data:
  image_format: jpg
  jpeg_quality: 95
  chunk_len: 4
  state_fields: [vx, vy, vz]
  train_action_fields: [vx, wz]
  raw_action_fields: [vx, vy, wz]

controller:
  vx_min: -0.1
  vx_max: 0.9
  wz_min: -1.3
  wz_max: 1.3
  k_vx: 0.78
  k_wz: 2.2
  goal_tolerance: 0.4
  turn_in_place_angle_deg: 60.0
  slow_angle_deg: 20.0
  min_turning_wz: 0.24
  vx_acc_limit: 1.0
  wz_acc_limit: 3.0

task:
  task_id: goal_navigation
  scene_mode: base_visible_nav
  target_class: black_box
  target_color: black
  target_shape: box
  goal_label: black box
  instruction_templates:
    - id: go_to_black_box_plain
      text: go to the black box
    - id: approach_black_box
      text: approach the black box
    - id: move_to_black_box
      text: move to the black box
  goal_distance_range: [0.8, 2.8]
  goal_region_resample_attempts: 320
  max_resample_attempts: 256
  default_split_hint: train_candidate
  workspace:
    x: [-4.5, 4.5]
    y: [-3.5, 3.5]
  visibility_curriculum:
    visible_early_ratio: 0.76
    visible_after_small_turn_ratio: 0.17
    search_ratio: 0.07
  visibility_probe:
    horizon_steps: 10
    min_depth: 0.40
    min_pixel_ratio: 0.0025
    horizontal_margin_deg: 3.5
    vertical_margin_deg: 3.5
  layout_templates:
    - id: short_forward_center
      visibility_buckets: [visible_early]
      spawn_region: {x: [-1.8, -1.1], y: [-0.6, 0.6]}
      goal_region: {x: [-0.2, 0.9], y: [-0.7, 0.7]}
      distance_range: [1.1, 2.4]
      yaw_jitter_deg: 4.0
    - id: left_offset_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.0, -1.2], y: [-1.5, -0.3]}
      goal_region: {x: [-0.4, 0.8], y: [0.0, 1.1]}
      distance_range: [1.2, 2.6]
      yaw_jitter_deg: 4.0
    - id: right_offset_visible
      visibility_buckets: [visible_early]
      spawn_region: {x: [-2.0, -1.2], y: [0.3, 1.5]}
      goal_region: {x: [-0.4, 0.8], y: [-1.1, 0.0]}
      distance_range: [1.2, 2.6]
      yaw_jitter_deg: 4.0
    - id: doorway_left_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.3, -1.4], y: [-1.6, -0.4]}
      goal_region: {x: [0.2, 1.1], y: [-0.2, 1.2]}
      distance_range: [1.2, 2.5]
      yaw_jitter_deg: 3.0
    - id: doorway_right_reveal
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.3, -1.4], y: [0.4, 1.6]}
      goal_region: {x: [0.2, 1.1], y: [-1.2, 0.2]}
      distance_range: [1.2, 2.5]
      yaw_jitter_deg: 3.0
    - id: blind_corner_search
      visibility_buckets: [search]
      spawn_region: {x: [-2.6, -1.8], y: [-1.8, 1.8]}
      goal_region: {x: [0.8, 1.8], y: [-1.8, 1.8]}
      distance_range: [1.6, 2.4]
      yaw_jitter_deg: 3.0
