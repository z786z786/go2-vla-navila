scene_config: scene_office.yaml
robot_config: robot_go2_camera.yaml
domain_randomization_config: domain_randomization.yaml
packing_config: packing.yaml

runtime:
  run_name: turn_heavy_goal_nav
  dataset_name: go2_isaac_turn_heavy_goal_nav_visible
  headless: true
  auto_pack: false
  num_episodes: 800
  max_steps_per_episode: 200
  seed: 0
  output_dir: ../data/isaac_sim_raw/turn_heavy_visible_nav_seed0
  packed_output_dir: ../data/isaac_sim_packed/turn_heavy_visible_nav_seed0

sim:
  device: cuda:0
  physics_dt: 0.01
  control_dt: 0.05
  warmup_steps_after_reset: 3

data:
  image_format: jpg
  jpeg_quality: 95
  chunk_len: 4
  state_fields: [vx, vy, vz]
  train_action_fields: [vx, wz]
  raw_action_fields: [vx, vy, wz]

controller:
  vx_min: -0.1
  vx_max: 0.9
  wz_min: -1.4
  wz_max: 1.4
  k_vx: 0.74
  k_wz: 2.35
  goal_tolerance: 0.4
  turn_in_place_angle_deg: 58.0
  slow_angle_deg: 18.0
  min_turning_wz: 0.28
  vx_acc_limit: 0.9
  wz_acc_limit: 3.2

task:
  task_id: goal_navigation
  scene_mode: turn_heavy_visible_nav
  target_class: black_box
  target_color: black
  target_shape: box
  goal_label: black box
  instruction_templates:
    - id: go_to_black_box_plain
      text: go to the black box
    - id: approach_black_box
      text: approach the black box
  goal_distance_range: [0.8, 2.8]
  goal_region_resample_attempts: 320
  max_resample_attempts: 256
  default_split_hint: train_candidate
  workspace:
    x: [-4.5, 4.5]
    y: [-3.5, 3.5]
  visibility_curriculum:
    visible_early_ratio: 0.68
    visible_after_small_turn_ratio: 0.24
    search_ratio: 0.08
  visibility_probe:
    horizon_steps: 10
    min_depth: 0.40
    min_pixel_ratio: 0.0025
    horizontal_margin_deg: 3.5
    vertical_margin_deg: 3.5
  layout_templates:
    - id: left_edge_close_turn
      visibility_buckets: [visible_early]
      spawn_region: {x: [-1.9, -1.2], y: [-1.5, -0.4]}
      goal_region: {x: [-0.5, 0.3], y: [0.2, 1.2]}
      distance_range: [1.0, 2.4]
      yaw_jitter_deg: 3.0
    - id: right_edge_close_turn
      visibility_buckets: [visible_early]
      spawn_region: {x: [-1.9, -1.2], y: [0.4, 1.5]}
      goal_region: {x: [-0.5, 0.3], y: [-1.2, -0.2]}
      distance_range: [1.0, 2.4]
      yaw_jitter_deg: 3.0
    - id: doorway_left_reveal_turn
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.4, -1.6], y: [-1.7, -0.5]}
      goal_region: {x: [0.2, 1.1], y: [-0.2, 1.3]}
      distance_range: [1.1, 2.5]
      yaw_jitter_deg: 2.5
    - id: doorway_right_reveal_turn
      visibility_buckets: [visible_after_small_turn]
      spawn_region: {x: [-2.4, -1.6], y: [0.5, 1.7]}
      goal_region: {x: [0.2, 1.1], y: [-1.3, 0.2]}
      distance_range: [1.1, 2.5]
      yaw_jitter_deg: 2.5
    - id: reverse_reorient_search
      visibility_buckets: [search]
      spawn_region: {x: [-2.6, -1.8], y: [-1.8, 1.8]}
      goal_region: {x: [0.8, 1.8], y: [-1.8, 1.8]}
      distance_range: [1.5, 2.4]
      yaw_jitter_deg: 2.5
