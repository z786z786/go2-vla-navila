<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LLaDA-VLA Go2 模型架构图</title>
<style>
  body { margin:0; background:#020617; color:#dbeafe; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; color:#e0f2fe; }
  .sub { color:#94a3b8; margin-bottom: 18px; }
  .card { border:1px solid #1e293b; border-radius:14px; background:#0f172a; padding:14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  svg { width:100%; height:auto; display:block; background:#020617; border-radius:10px; }
  .note { color:#cbd5e1; font-size:13px; line-height:1.6; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
<h1>LLaDA-VLA Go2 Velocity-Control 模型架构</h1>
<div class="sub">重点标注 action_positions 与 action_labels 在 dataset、prompt、wrapper、backbone、action heads、loss/decoder 中的位置。</div>
<div class="card">
<svg viewBox="0 0 1420 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fb923c"/></marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
    <style>
      .boxbg{fill:#0f172a}.data{fill:rgba(8,51,68,.45);stroke:#22d3ee;stroke-width:1.5}.proc{fill:rgba(6,78,59,.45);stroke:#34d399;stroke-width:1.5}.model{fill:rgba(76,29,149,.42);stroke:#a78bfa;stroke-width:1.5}.loss{fill:rgba(136,19,55,.42);stroke:#fb7185;stroke-width:1.5}.out{fill:rgba(120,53,15,.35);stroke:#fbbf24;stroke-width:1.5}.meta{fill:rgba(251,146,60,.28);stroke:#fb923c;stroke-width:1.5}.t{font:12px monospace;fill:#e2e8f0}.s{font:10px monospace;fill:#cbd5e1}.xs{font:9px monospace;fill:#94a3b8}.title{font:14px monospace;fill:#f8fafc;font-weight:700}.arrow{stroke:#38bdf8;stroke-width:2;fill:none;marker-end:url(#arrow)}.arrowG{stroke:#34d399;stroke-width:2;fill:none;marker-end:url(#arrowG)}.arrowO{stroke:#fb923c;stroke-width:2;fill:none;marker-end:url(#arrowO)}.arrowR{stroke:#fb7185;stroke-width:2;fill:none;marker-end:url(#arrowR);stroke-dasharray:6 4}.boundary{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:8 5}.label{font:13px monospace;fill:#93c5fd;font-weight:700}
    </style>
  </defs>
  <rect width="1420" height="1060" fill="url(#grid)"/>

  <text x="40" y="38" class="title">训练路径 Training: continuous action chunk -> action_labels -> action slots -> masked denoising loss</text>
  <text x="40" y="552" class="title">推理路径 Inference: all-mask action slots -> iterative denoise -> residual/absolute action chunk</text>

  <!-- training row boxes -->
  <rect x="35" y="60" width="270" height="150" rx="10" class="boxbg"/><rect x="35" y="60" width="270" height="150" rx="10" class="data"/>
  <text x="55" y="88" class="label">Processed Dataset Sample</text>
  <text x="55" y="116" class="s">instruction</text>
  <text x="55" y="136" class="s">image / image_path</text>
  <text x="55" y="156" class="s">state: vx,vy,yaw_speed,...</text>
  <text x="55" y="176" class="s">previous_action</text>
  <text x="55" y="196" class="s">action_chunk: [K,3]</text>

  <rect x="350" y="60" width="300" height="150" rx="10" class="boxbg"/><rect x="350" y="60" width="300" height="150" rx="10" class="proc"/>
  <text x="370" y="88" class="label">Dataset Semantic Build</text>
  <text x="370" y="116" class="s">anchor_chunk = Anchor(previous_action)</text>
  <text x="370" y="136" class="s">target_chunk = action - anchor</text>
  <text x="370" y="156" class="s">VelocityTokenizer quantize</text>
  <text x="370" y="176" class="s">action_mask -> action_valid_mask</text>
  <text x="370" y="196" class="s">K=4 train => 3K=12 tokens</text>

  <rect x="695" y="60" width="310" height="150" rx="10" class="boxbg"/><rect x="695" y="60" width="310" height="150" rx="10" class="meta"/>
  <text x="715" y="88" class="label">Prompt Tokenization</text>
  <text x="715" y="116" class="s">prompt = image + instruction + state</text>
  <text x="715" y="136" class="s">+ optional previous_action</text>
  <text x="715" y="156" class="s">+ &lt;action_tokens&gt; MASK...MASK</text>
  <text x="715" y="180" class="t">action_positions: [B,3K]</text>
  <text x="715" y="200" class="xs">absolute token indices of action slots</text>

  <rect x="1050" y="60" width="320" height="150" rx="10" class="boxbg"/><rect x="1050" y="60" width="320" height="150" rx="10" class="meta"/>
  <text x="1070" y="88" class="label">Supervision Labels</text>
  <text x="1070" y="116" class="t">action_labels: [B,3K]</text>
  <text x="1070" y="136" class="s">flattened [vx,vy,wz] * K bins</text>
  <text x="1070" y="156" class="s">sequence labels: IGNORE except</text>
  <text x="1070" y="176" class="s">labels[action_positions]=action_labels</text>
  <text x="1070" y="196" class="xs">classification targets, not token positions</text>

  <path d="M305 135 H350" class="arrow"/><path d="M650 135 H695" class="arrow"/><path d="M1005 135 H1050" class="arrowO"/>

  <rect x="60" y="270" width="310" height="155" rx="10" class="boxbg"/><rect x="60" y="270" width="310" height="155" rx="10" class="model"/>
  <text x="80" y="298" class="label">LladaVLAForVelocityControl.forward</text>
  <text x="80" y="326" class="s">_prepare_inputs: LLaDA-V multimodal</text>
  <text x="80" y="346" class="s">_resolve_action_positions</text>
  <text x="80" y="370" class="t">uses action_positions to find slots</text>
  <text x="80" y="392" class="s">input_ids / attention_mask / images</text>
  <text x="80" y="412" class="s">labels or action_labels</text>

  <rect x="430" y="270" width="310" height="155" rx="10" class="boxbg"/><rect x="430" y="270" width="310" height="155" rx="10" class="model"/>
  <text x="450" y="298" class="label">Action Embedding Injection</text>
  <text x="450" y="326" class="s">for each offset in action_positions</text>
  <text x="450" y="348" class="s">dim = (vx,vy,wz)[offset % 3]</text>
  <text x="450" y="372" class="t">action_labels -> vx/vy/wz Embedding</text>
  <text x="450" y="394" class="s">replace placeholder embeddings</text>
  <text x="450" y="414" class="xs">clean_embeds with true action tokens</text>

  <rect x="800" y="270" width="260" height="155" rx="10" class="boxbg"/><rect x="800" y="270" width="260" height="155" rx="10" class="loss"/>
  <text x="820" y="298" class="label">Action Corruption</text>
  <text x="820" y="326" class="s">mask only action slots</text>
  <text x="820" y="348" class="s">high-mask curriculum</text>
  <text x="820" y="372" class="s">masked_action_mask: [B,3K]</text>
  <text x="820" y="394" class="s">p_mask: [B,3K]</text>
  <text x="820" y="414" class="xs">noisy_embeds to backbone</text>

  <rect x="1120" y="270" width="250" height="155" rx="10" class="boxbg"/><rect x="1120" y="270" width="250" height="155" rx="10" class="model"/>
  <text x="1140" y="298" class="label">LLaDA-V Backbone</text>
  <text x="1140" y="326" class="s">vision tower + projector</text>
  <text x="1140" y="348" class="s">language/diffusion transformer</text>
  <text x="1140" y="372" class="t">hidden_states: [B,L,H]</text>
  <text x="1140" y="394" class="xs">conditioned on image/text/state</text>

  <path d="M1205 210 C1180 235 1245 238 1245 270" class="arrow"/>
  <path d="M215 210 C205 238 215 244 215 270" class="arrow"/>
  <path d="M370 348 H430" class="arrowG"/><path d="M740 348 H800" class="arrowR"/><path d="M1060 348 H1120" class="arrow"/>

  <rect x="110" y="455" width="310" height="135" rx="10" class="boxbg"/><rect x="110" y="455" width="310" height="135" rx="10" class="proc"/>
  <text x="130" y="482" class="label">Gather Action Hidden States</text>
  <text x="130" y="510" class="s">hidden_states[batch, action_positions]</text>
  <text x="130" y="534" class="t">[B,L,H] + [B,3K] -> [B,3K,H]</text>
  <text x="130" y="558" class="xs">action_positions is the bridge from prompt slots to model states</text>

  <rect x="500" y="455" width="310" height="135" rx="10" class="boxbg"/><rect x="500" y="455" width="310" height="135" rx="10" class="proc"/>
  <text x="520" y="482" class="label">Localized ActionHeads</text>
  <text x="520" y="510" class="s">slot % 3 == 0 -> vx_head</text>
  <text x="520" y="530" class="s">slot % 3 == 1 -> vy_head</text>
  <text x="520" y="550" class="s">slot % 3 == 2 -> wz_head</text>
  <text x="520" y="574" class="t">logits: [B,3K,n_bins]</text>

  <rect x="890" y="455" width="300" height="135" rx="10" class="boxbg"/><rect x="890" y="455" width="300" height="135" rx="10" class="loss"/>
  <text x="910" y="482" class="label">LLaDA Diffusion CE Loss</text>
  <text x="910" y="510" class="s">CE(action_logits, action_labels)</text>
  <text x="910" y="532" class="s">only where masked_action_mask & valid</text>
  <text x="910" y="554" class="s">/ p_mask, slot weights vx/vy/wz</text>
  <text x="910" y="576" class="xs">action_labels are the classification ground truth</text>

  <path d="M1245 425 C1245 470 435 430 420 500" class="arrow"/>
  <path d="M420 522 H500" class="arrowG"/><path d="M810 522 H890" class="arrowR"/>
  <path d="M1210 210 C1260 250 1040 410 1040 455" class="arrowO"/>

  <!-- inference row -->
  <rect x="55" y="620" width="300" height="130" rx="10" class="boxbg"/><rect x="55" y="620" width="300" height="130" rx="10" class="data"/>
  <text x="75" y="648" class="label">Inference Prompt</text>
  <text x="75" y="676" class="s">image + instruction + state</text>
  <text x="75" y="698" class="s">action slots initialized as MASK</text>
  <text x="75" y="722" class="t">action_positions: [B,3K]</text>
  <text x="75" y="742" class="xs">no action_labels needed at inference</text>

  <rect x="430" y="620" width="300" height="130" rx="10" class="boxbg"/><rect x="430" y="620" width="300" height="130" rx="10" class="model"/>
  <text x="450" y="648" class="label">VelocityDiffusionDecoder</text>
  <text x="450" y="676" class="s">for decode_steps:</text>
  <text x="450" y="698" class="s">backbone -> gather action states</text>
  <text x="450" y="720" class="s">ActionHeads -> predictions/confidence</text>
  <text x="450" y="742" class="xs">resolved slots get predicted embeddings</text>

  <rect x="805" y="620" width="270" height="130" rx="10" class="boxbg"/><rect x="805" y="620" width="270" height="130" rx="10" class="proc"/>
  <text x="825" y="648" class="label">Step-level Remask</text>
  <text x="825" y="676" class="s">aggregate confidence per step</text>
  <text x="825" y="698" class="s">freeze [vx_t,vy_t,wz_t]</text>
  <text x="825" y="720" class="s">unresolved slots remain MASK</text>
  <text x="825" y="742" class="xs">not autoregressive text decoding</text>

  <rect x="1150" y="620" width="230" height="130" rx="10" class="boxbg"/><rect x="1150" y="620" width="230" height="130" rx="10" class="out"/>
  <text x="1170" y="648" class="label">Predicted Action Tokens</text>
  <text x="1170" y="676" class="t">action_tokens: [B,3K]</text>
  <text x="1170" y="698" class="s">action_probabilities</text>
  <text x="1170" y="720" class="s">step_confidence</text>

  <path d="M355 685 H430" class="arrow"/><path d="M730 685 H805" class="arrowG"/><path d="M1075 685 H1150" class="arrowO"/>
  <path d="M940 620 C940 585 610 585 580 620" class="arrowG"/>

  <rect x="80" y="805" width="310" height="145" rx="10" class="boxbg"/><rect x="80" y="805" width="310" height="145" rx="10" class="proc"/>
  <text x="100" y="832" class="label">VelocityTokenizer Decode</text>
  <text x="100" y="860" class="s">bins -> continuous target chunk</text>
  <text x="100" y="884" class="t">target_actions: [B,K,3]</text>
  <text x="100" y="906" class="s">residual target space in current mainline</text>

  <rect x="465" y="805" width="310" height="145" rx="10" class="boxbg"/><rect x="465" y="805" width="310" height="145" rx="10" class="proc"/>
  <text x="485" y="832" class="label">Anchor / Residual Recovery</text>
  <text x="485" y="860" class="s">anchor = repeat_prev(previous_action)</text>
  <text x="485" y="884" class="s">absolute = anchor + residual</text>
  <text x="485" y="908" class="t">continuous_actions: [B,K,3]</text>
  <text x="485" y="930" class="xs">clamp to absolute vx/vy/wz ranges</text>

  <rect x="850" y="805" width="310" height="145" rx="10" class="boxbg"/><rect x="850" y="805" width="310" height="145" rx="10" class="out"/>
  <text x="870" y="832" class="label">Controller Output</text>
  <text x="870" y="860" class="s">execute_actions = first N steps</text>
  <text x="870" y="884" class="s">sent through safety / EMA / rate limit</text>
  <text x="870" y="908" class="t">[vx, vy, wz]</text>
  <text x="870" y="930" class="xs">Go2 high-level velocity command</text>

  <path d="M1265 750 C1265 805 390 760 390 850" class="arrowO"/>
  <path d="M390 878 H465" class="arrowG"/><path d="M775 878 H850" class="arrowO"/>

  <rect x="60" y="980" width="1260" height="50" rx="8" class="boxbg"/><rect x="60" y="980" width="1260" height="50" rx="8" class="meta"/>
  <text x="80" y="1011" class="t">Key: action_positions = action slot indices in sequence; action_labels = bin-class targets for [vx,vy,wz]*K. They meet at labels[action_positions]=action_labels and at gather hidden_states[action_positions].</text>
</svg>
</div>
<div class="note">打开方式：xdg-open /home/wxh/llada-vla-go2/docs/llada_vla_go2_model_architecture_diagram.html</div>
</div>
